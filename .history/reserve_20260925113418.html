<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワークショップ予約｜旅香 - TABIKA -</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <main class="reservation-page">
    <div class="reservation-content">
      <p class="reservation-brand">旅香 - TABIKA -</p>
      <h1 class="reservation-title">ワークショップ予約</h1>
      <p class="reservation-lead">香りづくり体験の<br>ご希望の日程をお選びください。</p>

      <form id="reservation-form" novalidate>
        <section class="reservation-section" aria-labelledby="date-heading">
          <h2 id="date-heading"><span>①</span> 日付を選ぶ</h2>
          <p class="reservation-hint">📅 参加したい日を選択</p>
          <div class="availability-legend" aria-label="空き状況の凡例"><span>○ 空きあり</span><span>△ 残りわずか</span><span>× 満席</span>
          </div>
          <div class="calendar" id="calendar" aria-label="2026年9月の予約カレンダー"></div>
          <input type="hidden" id="reservation-date" name="reservation-date">
          <p class="field-error" data-error-for="reservation-date"></p>
        </section>

        <section class="reservation-section" aria-labelledby="time-heading">
          <h2 id="time-heading"><span>②</span> 時間を選ぶ</h2>
          <p class="reservation-hint">🕐 希望時間を選択</p>
          <div class="time-options" id="time-options" role="group" aria-label="希望時間"></div>
          <input type="hidden" id="reservation-time" name="reservation-time">
          <p class="field-error" data-error-for="reservation-time"></p>
        </section>

        <section class="reservation-section" aria-labelledby="participants-heading">
          <h2 id="participants-heading"><span>③</span> 人数を選ぶ</h2>
          <p class="reservation-hint">👥 参加人数を選択</p>
          <label class="form-label" for="participants">参加人数</label>
          <select id="participants" name="participants">
            <option value="">選択してください</option>
            <option value="1">1名</option>
            <option value="2">2名</option>
            <option value="3">3名</option>
            <option value="4">4名</option>
          </select>
          <p class="field-error" data-error-for="participants"></p>
        </section>

        <section class="reservation-section" aria-labelledby="customer-heading">
          <h2 id="customer-heading"><span>④</span> 予約情報を入力</h2>
          <p class="reservation-hint">✏️ お客様情報</p>
          <div class="form-grid">
            <div class="form-field"><label class="form-label" for="name">お名前 <span>必須</span></label><input id="name"
                name="name" type="text" autocomplete="name">
              <p class="field-error" data-error-for="name"></p>
            </div>
            <div class="form-field"><label class="form-label" for="email">メールアドレス <span>必須</span></label><input
                id="email" name="email" type="email" autocomplete="email">
              <p class="field-error" data-error-for="email"></p>
            </div>
            <div class="form-field"><label class="form-label" for="phone">電話番号 <span>必須</span></label><input id="phone"
                name="phone" type="tel" autocomplete="tel">
              <p class="field-error" data-error-for="phone"></p>
            </div>
            <div class="form-field form-field-full"><label class="form-label" for="note">備考</label><textarea id="note"
                name="note" rows="4"></textarea></div>
          </div>
        </section>

        <section class="reservation-section reservation-confirm-section" aria-labelledby="confirm-heading">
          <h2 id="confirm-heading"><span>⑤</span> 入力内容を確認</h2>
          <button class="reservation-button primary-button" type="submit">入力内容を確認する</button>
          <p style="text-align:center;color:var(--muted);font-size:13px;margin:16px 0 8px">予約手続きはじゃらんnetで行います</p>
          <a class="reservation-button jalan-button"
            href="https://www.jalan.net/kankou/spt_guide000000223856/activity/l000051249/" target="_blank"
            rel="noopener noreferrer">［じゃらん予約ページへ進む］</a>
          <div class="confirmation" id="confirmation" hidden aria-live="polite"></div>
        </section>
      </form>

      <div class="reservation-back"><a class="reservation-button back-button" href="./index.html">トップページに戻る</a></div>
    </div>
  </main>
  <script src="./js/reserve.js" defer></script>
</body>

</html>
