spring.application.name=tabika
# Render supplies PORT at runtime; keep 8080 for local development.
server.port=${PORT:8080}
spring.datasource.url=jdbc:mysql://localhost:3306/tabika?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
spring.datasource.username=tabika
spring.datasource.password=tabika
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
