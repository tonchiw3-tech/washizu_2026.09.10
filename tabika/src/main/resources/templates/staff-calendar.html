<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>スタッフ用予約カレンダー</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="page-container"><h1>スタッフ用予約カレンダー</h1><p>MySQLの予約データを日付ごとに表示しています。</p><table><tr><th>日付</th><th>予約件数</th><th>参加人数</th><th>詳細</th></tr><tr th:each="day : ${days}"><td th:text="${day.date}"></td><td th:text="${day.reservationCount}"></td><td th:text="${day.participantCount}"></td><td><a th:href="@{/staff/reservations(date=${day.date})}">日別予約を見る</a></td></tr></table><p th:if="${#lists.isEmpty(days)}">予約データはありません。</p><form method="post" action="/admin/logout"><button type="submit">ログアウト</button></form></main></body></html>
