<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>日別予約</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="page-container"><h1 th:text="${date + ' の予約'}">日別予約</h1><a href="/staff/calendar">カレンダーへ戻る</a><table><tr><th>時間</th><th>氏名</th><th>メール</th><th>人数</th><th>状態</th></tr><tr th:each="r : ${reservations}"><td th:text="${r.startTime}"></td><td th:text="${r.guestName}"></td><td th:text="${r.email}"></td><td th:text="${r.guestCount}"></td><td th:text="${r.status}"></td></tr></table><p th:if="${#lists.isEmpty(reservations)}">この日の予約データはありません。</p><form method="post" action="/admin/logout"><button type="submit">ログアウト</button></form></main></body></html>
