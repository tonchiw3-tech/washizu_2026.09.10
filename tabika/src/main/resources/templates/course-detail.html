<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.courseName} + ' - 旅香 - TABIKA -'">コース詳細 - 旅香 - TABIKA -</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <div class="page-container page-header">
        <h1 class="page-title">旅香 - TABIKA -</h1>
    </div>
</header>
<main>
    <div class="page-container">
        <section class="card course-detail" th:if="${course != null}">
            <h1 th:text="${course.courseName}">コース名</h1>
            <dl class="course-detail-list">
                <dt>利用シーン</dt><dd th:text="${course.scene}">利用シーン</dd>
                <dt>所要時間</dt><dd th:text="${course.duration}">所要時間</dd>
                <dt>出発地点</dt><dd th:text="${course.departurePoint}">出発地点</dd>
                <dt>天候</dt><dd th:text="${course.weather}">天候</dd>
                <dt>コース説明</dt><dd th:text="${course.description}">コース説明</dd>
            </dl>
        </section>
        <p class="empty-message" th:if="${course == null}">コースが見つかりません</p>
        <div class="course-actions">
            <a class="button button-primary" href="/courses">コース一覧へ戻る</a>
            <span class="button" aria-disabled="true">ワークショップを予約する</span>
            <p class="reservation-note">予約URLは現在準備中です。</p>
        </div>
    </div>
</main>
</body>
</html>
