<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あなたにぴったりプラン - 旅香 - TABIKA -</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <div class="page-container page-header">
        <h1 class="page-title">旅香 - TABIKA -</h1>
    </div>
</header>
<main>
    <div class="page-container">
        <h1>あなたにぴったりプラン</h1>
        <p>いくつかの質問に答えて、浅草での過ごし方を見つけてみてください。</p>
        <form class="card" action="/recommend/result" method="post">
            <p>
                <label for="scene">利用シーン</label><br>
                <select id="scene" name="scene">
                    <option value="散策">散策</option>
                    <option value="食べ歩き">食べ歩き</option>
                    <option value="観光">観光</option>
                </select>
            </p>
            <p>
                <label for="time">利用できる時間</label><br>
                <select id="time" name="time">
                    <option value="短時間">短時間</option>
                    <option value="半日">半日</option>
                    <option value="一日">一日</option>
                </select>
            </p>
            <button class="button button-primary" type="submit">プランを探す</button>
        </form>
    </div>
</main>
</body>
</html>
