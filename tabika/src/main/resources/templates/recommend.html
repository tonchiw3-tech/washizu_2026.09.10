<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>次の予定まで、浅草でどう過ごす？ - 旅香 - TABIKA -</title><link rel="stylesheet" href="/css/style.css"><script src="/js/recommend.js" defer></script></head>
<body><header><div class="page-container page-header"><a class="page-title" href="/">旅香 - TABIKA -</a></div></header>
<main><div class="page-container form-container"><p class="eyebrow">PLAN YOUR TIME</p><h1>次の予定まで、浅草でどう過ごす？</h1><p class="lead">新幹線・飛行機・イベントなど、<br>次の予定に間に合う範囲で、<br>今から楽しめる浅草の過ごし方をご提案します。</p>
<form class="card search-form" action="/recommend/result" method="post" id="recommend-form">
<fieldset><legend><span>1</span> 次の予定は？</legend><div class="choice-grid choice-grid-four">
<label class="choice-card"><input type="radio" name="nextPlan" value="train" required><span>新幹線</span></label><label class="choice-card"><input type="radio" name="nextPlan" value="flight"><span>飛行機</span></label><label class="choice-card"><input type="radio" name="nextPlan" value="event"><span>イベント</span></label><label class="choice-card"><input type="radio" name="nextPlan" value="other"><span>その他</span></label>
</div></fieldset>
<fieldset><legend><span>2</span> 次はどこへ行きますか？</legend><select id="destination" name="destination" required disabled><option value="">先に「次の予定」を選択してください</option></select></fieldset>
<fieldset><legend><span>3</span> 何時までに着きたいですか？</legend><input id="arrivalTime" name="arrivalTime" type="time" required></fieldset>
<button class="button button-primary submit-button" type="submit">おすすめの過ごし方を見る</button>
</form></div></main><footer th:replace="~{fragments/footer :: site-footer}"></footer></body></html>
