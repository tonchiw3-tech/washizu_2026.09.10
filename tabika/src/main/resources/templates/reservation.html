<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>予約</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="page-container"><h1>ワークショップ予約</h1><form method="post" action="/reservation"><input type="hidden" name="date" th:value="${date}"><label>日付<input type="date" name="date" th:value="${date}" required></label><label>時間<select name="slotId" required><option value="">選択してください</option><option th:each="slot:${slots}" th:value="${slot.id}" th:text="${slot.startTime+'（残り '+slot.remaining+'名）'}"></option></select></label><label>氏名<input name="guestName" required></label><label>メール<input type="email" name="email" required></label><label>人数<input type="number" name="guestCount" min="1" max="5" required></label><label>備考<textarea name="note"></textarea></label><p th:if="${#fields.hasErrors('*')}" th:errors="*{global}"></p><button type="submit">予約する</button></form></main></body></html>
