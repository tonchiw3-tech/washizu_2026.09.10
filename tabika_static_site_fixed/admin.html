<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 | 旅香 - TABIKA -</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="tabika-app">
  <header class="app-header">
    <a class="app-brand" href="./index.html" aria-label="旅香 TABIKA トップへ">
      <img src="./assets/logo.png" alt="旅香 TABIKA">
      <span>旅香 管理画面</span>
    </a>
    <nav class="app-nav" aria-label="管理ナビゲーション">
      <a href="./index.html">公開画面</a>
      <button id="logout-button" class="nav-button" type="button" hidden>ログアウト</button>
    </nav>
  </header>

  <main class="admin-shell">
    <section id="login-panel" class="admin-panel login-panel" aria-labelledby="login-title">
      <div class="app-section-head">
        <p>Admin Login</p>
        <h1 id="login-title">管理者ログイン</h1>
      </div>
      <form id="login-form" class="admin-form" novalidate>
        <label>
          <span>ログインID</span>
          <input name="loginId" type="text" maxlength="100" autocomplete="username">
        </label>
        <label>
          <span>パスワード</span>
          <input name="password" type="password" autocomplete="current-password">
        </label>
        <p id="login-error" class="form-message" role="alert"></p>
        <button class="app-button" type="submit">ログイン</button>
        <p class="admin-hint">デモ用ID: admin / パスワード: tabika2026</p>
      </form>
    </section>

    <section id="admin-panel" class="admin-panel" hidden>
      <div class="admin-heading">
        <div class="app-section-head">
          <p>Plan Management</p>
          <h1>管理者プラン一覧</h1>
        </div>
        <button id="new-plan-button" class="app-button" type="button">新規登録</button>
      </div>
      <p id="admin-message" class="success-message" aria-live="polite"></p>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>プラン名</th>
              <th>所要時間</th>
              <th>出発地点</th>
              <th>天候</th>
              <th>公開状態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="admin-plan-list"></tbody>
        </table>
      </div>
    </section>

    <section id="editor-panel" class="admin-panel" hidden>
      <div class="app-section-head">
        <p>Plan Editor</p>
        <h1 id="editor-title">プラン登録</h1>
      </div>
      <form id="plan-editor-form" class="editor-grid" novalidate>
        <input type="hidden" name="id">
        <label><span>プラン名</span><input name="title" type="text" maxlength="100"></label>
        <label><span>キャッチコピー</span><input name="catchcopy" type="text" maxlength="150"></label>
        <label class="wide"><span>説明</span><textarea name="description" maxlength="2000"></textarea></label>
        <label><span>所要時間（分）</span><input name="durationMinutes" type="number" min="1"></label>
        <label><span>出発地点</span><select name="startLocation"><option>浅草</option><option>上野</option><option>両国</option><option>東京駅</option><option>羽田空港</option></select></label>
        <label><span>移動時間（分）</span><input name="transferMinutes" type="number" min="0"></label>
        <label><span>天候タイプ</span><select name="weatherType"><option>晴れ</option><option>雨</option><option>両方</option></select></label>
        <label><span>利用シーン</span><select name="scene"><option>観光</option><option>ものづくり</option><option>空き時間</option><option>一人時間</option><option>イベント</option><option>雨天</option></select></label>
        <label class="wide"><span>モデルコース</span><textarea name="modelCourse" maxlength="2000"></textarea></label>
        <label><span>予約URL</span><input name="reservationUrl" type="url"></label>
        <label class="check-row"><input name="published" type="checkbox"> <span>公開する</span></label>
        <p id="editor-error" class="form-message wide" role="alert"></p>
        <div class="editor-actions wide">
          <button class="app-button" type="submit">登録する</button>
          <button id="cancel-editor" class="text-button" type="button">一覧へ戻る</button>
        </div>
      </form>
    </section>
  </main>

  <script src="./js/app.js" defer></script>
  <script src="./js/admin.js" defer></script>
</body>
</html>
