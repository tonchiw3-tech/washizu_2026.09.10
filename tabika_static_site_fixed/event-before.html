<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント前のすき間時間｜旅香 - TABIKA -</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="page-shell event-page">
    <section class="page-content" aria-labelledby="event-title">
      <h1 id="event-title" class="page-title">イベント前のすき間時間</h1>
      <section class="route-section" aria-labelledby="event-route-title">
        <h2 id="event-route-title">① イベント会場から浅草へ</h2>
        <div class="route-grid event-route">
          <article class="route-card event-card">
            <span class="event-icon" aria-hidden="true">🎫</span>
            <h3>東京ドーム</h3>
            <p class="event-highlight">🎫 <strong>東京ドーム → 浅草</strong></p>
            <p class="route-time">🚃 電車 約30分</p>
          </article>
          <article class="route-card event-card">
            <span class="event-icon" aria-hidden="true">🎫</span>
            <h3>日本武道館</h3>
            <p class="event-highlight">🎫 <strong>日本武道館 → 浅草</strong></p>
            <p class="route-time">🚃 電車 約25分</p>
          </article>
          <article class="route-card event-card">
            <span class="event-icon" aria-hidden="true">🎫</span>
            <h3>両国国技館</h3>
            <p class="event-highlight">🎫 <strong>両国国技館 → 浅草</strong></p>
            <p class="route-time">🚃 電車 約20分</p>
          </article>
        </div>
        <p class="event-note">※所要時間は利用する路線や時間帯により異なります。</p>
      </section>

      <p class="route-arrow event-section-arrow" aria-hidden="true">↓</p>

      <section class="experience-section event-experience" aria-labelledby="event-experience-title">
        <h2 id="event-experience-title">② 香りをつくる</h2>
        <p class="event-icon" aria-hidden="true">🌿</p>
        <p class="event-highlight"><strong>自分だけの香りをつくる</strong></p>
        <p>イベント前のすき間時間に、<br>浅草で香りづくりを楽しみます。</p>
        <p class="event-message"><strong>イベント前のすき間時間も、思い出に変える。</strong></p>
        <nav class="page-actions" aria-label="イベント前プランの操作">
          <a class="pill" href="./index.html#reserve">予約する</a>
        </nav>
      </section>
    </section>
    <nav class="page-actions page-back-actions" aria-label="トップページへ戻る">
      <a class="pill back-pill" href="./index.html#top">トップページに戻る</a>
    </nav>
  </main>
</body>
</html>
