<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雨の日プラン｜旅香 - TABIKA -</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="page-shell rainy-page">
    <section class="page-content rainy-content section-wide" aria-labelledby="rainy-title">
      <div class="rainy-hero">
        <div>
          <h1 id="rainy-title" class="page-title section-title">雨の日プラン</h1>
        </div>
      </div>

      <div class="rainy-flow">
        <section class="rainy-block">
          <h2>① 上野で室内アクティビティ</h2>
          <div class="rainy-stops">
            <article class="rainy-stop">
              <span class="rainy-icon" aria-hidden="true">☔</span>
              <div><h3>上野公園周辺</h3><p class="rainy-highlight">博物館や美術館を楽しむ</p><p>上野公園周辺には、<br>室内で楽しめるスポットがあります。</p></div>
            </article>
          </div>
        </section>

        <p class="rainy-section-arrow" aria-hidden="true">↓</p>
        <section class="rainy-aroma rainy-transfer">
          <p class="rainy-icon" aria-hidden="true">🚃</p>
          <h2>② 浅草へ移動</h2>
          <p class="rainy-highlight">上野 → 浅草</p>
          <p>電車 約10分</p>
        </section>

        <p class="rainy-section-arrow" aria-hidden="true">↓</p>
        <section class="experience-section rainy-aroma">
          <p class="rainy-icon" aria-hidden="true">🌿</p>
          <h2>③ 香りをつくる</h2>
          <p class="rainy-highlight">自分だけの香りをつくる</p>
          <p>浅草へ移動して、<br>室内で香りづくりを楽しみます。</p>
          <p class="rainy-message">「雨の日も、思い出に残る一日に。」</p>
            <nav class="page-actions rainy-actions" aria-label="ページの操作">
            <a class="pill" href="./reserve.html">予約する</a>
          </nav>
        </section>
      </div>

    </section>
    <nav class="page-actions rainy-actions rainy-back-actions" aria-label="トップページへ戻る">
      <a class="pill rainy-back" href="./index.html">トップページに戻る</a>
    </nav>
  </main>

</html>
