<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約内容の入力｜旅香 - TABIKA -</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="./css/style.css">
</head>
<body><main class="reservation-page"><div class="reservation-content">
  <p class="reservation-brand">旅香 - TABIKA -</p><h1 class="reservation-title">予約内容の入力</h1>
  <p class="reservation-lead">土日祝日の約60分ワークショップについて、ご希望の日時・人数・お名前を入力してください。</p>
  <p class="reservation-hint">受付はワークショップ開始時刻の10分前までにお願いします。</p>
  <form class="reservation-section" action="#reservation-complete" method="get"><div class="form-grid">
    <div><label class="form-label" for="date">希望日<span>必須</span></label><input id="date" name="date" type="date" required></div>
    <div><label class="form-label" for="time">希望時間<span>必須</span></label><select id="time" name="time" required><option value="">選択してください</option><option>11:00</option><option>13:00</option><option>15:00</option></select></div>
    <div><label class="form-label" for="guests">人数<span>必須</span></label><select id="guests" name="guests" required><option value="">選択してください</option><option>1名</option><option>2名</option><option>3名</option><option>4名</option><option>5名以上</option></select></div>
    <div><label class="form-label" for="name">お名前<span>必須</span></label><input id="name" name="name" type="text" autocomplete="name" placeholder="例：旅香 花子" required></div>
    <div class="form-field-full"><label class="form-label" for="email">メールアドレス<span>必須</span></label><input id="email" name="email" type="email" autocomplete="email" placeholder="例：hello@example.com" required></div>
    <div class="form-field-full"><label class="form-label" for="note">備考</label><textarea id="note" name="note" placeholder="ご質問やご要望があれば入力してください"></textarea></div>
  </div><button class="reservation-button jalan-button" type="submit">入力内容を確認する</button></form>
  <div class="reservation-back"><a class="reservation-button back-button" href="./reserve.html">予約入口に戻る</a></div>
</div></main></body></html>
